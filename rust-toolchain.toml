[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# Every release cross-compile target must be listed here. The CI image
# prepares targets for its own default toolchain, but rustup installs a
# fresh toolchain to honor this file, without those targets. An unlisted
# target fails with "can't find crate for `core`" or "target may not be
# installed".
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu"]
